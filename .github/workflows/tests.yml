name: tests

# Everything here runs without a phone and without a model: fake llama-server, fake Android shell, canned screens.
# What needs the Seeker itself is measured on the device and recorded in docs/RESULTS.md, docs/TESTS.md and tests/phone/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # the job reads the code, nothing else

jobs:
  tests:
    runs-on: macos-latest   # the scripts are written for the Mac that drives the phone (BSD tail, sed)
    timeout-minutes: 30
    steps:
      # actions pinned to a reviewed commit, not a moving tag (v4.2.2 and v5.6.0, checked on 17/11/2026)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Syntax of every script
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
          python3 -m py_compile $(git ls-files '*.py') ai/seeker-ai ai/zion terminal/seeker-dash terminal/zion-hw privacy/zion-guard
          sh -n terminal/zion-stop
      - name: OPERATOR (agent, screen tool, tasks, service, policy with nobody at the terminal, injection guard)
        run: python3 ai/test_seeker_ai.py
      - name: zion (queue, resume, limits, approvals, emergency stop, journal)
        run: python3 ai/test_zion.py
      - name: Shell integration, dashboard, hardware detection
        run: |
          python3 terminal/test_zion_shell.py
          python3 terminal/test_seeker_dash.py
          python3 terminal/zion-hw --selftest
      - name: Privacy and security tools (journal, firewall dry run, capture parser, threat check)
        run: |
          bash tests/test_journal_ops.sh
          python3 -I privacy/pcap_domains.py --selftest
          python3 -I privacy/test_zion_guard.py
      - name: Launcher approval format (plain JDK, same code as the app)
        # the runner's default JAVA_HOME may be Java 8, which has no --release: take its JDK 17
        run: JAVA_HOME="${JAVA_HOME_17_arm64:-${JAVA_HOME_17_X64:-$JAVA_HOME}}" bash launcher/test/run.sh
      - name: Benchmarks and evaluation harnesses (dry runs)
        run: |
          python3 tests/bench_decide.py --test
          python3 tests/eval_fr.py --selftest
          python3 tests/eval_ui.py --selftest
          python3 tests/eval_tools.py --selftest
          bash tests/test_chain_dry.sh
          bash tests/test_eval_tools_chain_dry.sh
          bash tests/test_bench_power_dry.sh
          bash tests/test_bench_dry.sh
