name: ZION OPERATOR safety tests

on:
  push:
    branches:
      - main
      - feature/operator-phone-control-security-audit-20261117
  pull_request:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (pinned, no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Python syntax
        run: python3 -m py_compile ai/zion_ui.py ai/test_zion_ui.py ai/test_seeker_ai.py
      - name: Test validated UI actions (no device)
        run: python3 -I ai/test_zion_ui.py
      - name: Test local agent permissions (fake on-device commands)
        run: python3 ai/test_seeker_ai.py
      - name: Check Termux setup script syntax
        run: bash -n terminal/termux-setup.sh
